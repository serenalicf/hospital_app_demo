<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="common/meta :: meta"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">

    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form id="ec" th:action="@{/hospitalSetting/save}" method="post" class="form-horizontal">
                        <input type="hidden" name="id" value="1">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">Hospital code：</label>

                            <div class="col-sm-10">
                                <input type="text" name="hospitalCode" id="hospitalCode" th:value="${hospitalSetting.hospitalCode}" class="form-control"/>
                            </div>
                        </div>
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">Signature key：</label>

                            <div class="col-sm-10">
                                <input type="text" name="signKey" id="signKey" th:value="${hospitalSetting.signKey}" class="form-control"/>
                            </div>
                        </div>
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">Unified Appointment System Base URL：</label>

                            <div class="col-sm-10">
                                <input type="text" name="apiUrl" id="apiUrl" th:value="${hospitalSetting.apiUrl}" class="form-control"/>
                            </div>
                        </div>
                        <div class="hr-line-dashed"></div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-2">
                                <button class="btn btn-primary" type="submit">Save</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
<script type="text/javascript">
    $(function(){
        $('#ec').validate({
            rules:{
                hospitalCode:"required",
                signKey:"required",
                apiUrl:"required",
            },
            messages:{
                hospitalCode:"Required Field",
                signKey:"Required Field",
                apiUrl:"Required Field"
            },
            submitHandler: function(form) {
                opt.load();
                $(form).find(":submit").attr("disabled", true).text("Submitting Data...");
                form.submit();
            }
        });
    });
</script>
