spring.application.name=data-service
server.port=8202
spring.profiles.active=dev

# mysql connection
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_management?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Hong_Kong
spring.datasource.username=root
spring.datasource.password=root

#json datetime format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=1800000

spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-wait=-1
# Maximum blocking wait time (negative means unlimited)
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=0

logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG